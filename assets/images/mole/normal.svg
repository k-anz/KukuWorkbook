<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <!-- Hole -->
  <ellipse cx="60" cy="170" rx="52" ry="13" fill="#0D0705"/>
  <!-- Body -->
  <ellipse cx="60" cy="158" rx="48" ry="26" fill="#7B4A22"/>
  <!-- Head - big round -->
  <ellipse cx="60" cy="108" rx="46" ry="44" fill="#7B4A22"/>
  <!-- Snout beige - centered, forward facing -->
  <ellipse cx="60" cy="122" rx="26" ry="22" fill="#D4A876"/>
  <!-- Nose - centered black -->
  <ellipse cx="60" cy="112" rx="9" ry="8" fill="#1A1A1A"/>
  <!-- Nostrils -->
  <ellipse cx="56" cy="113" rx="2.5" ry="2" fill="#0A0A0A"/>
  <ellipse cx="64" cy="113" rx="2.5" ry="2" fill="#0A0A0A"/>
  <!-- Whiskers - both sides -->
  <line x1="50" y1="118" x2="20" y2="110" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="122" x2="18" y2="122" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="126" x2="20" y2="134" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="118" x2="100" y2="110" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="122" x2="102" y2="122" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="126" x2="100" y2="134" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyes - symmetric -->
  <circle cx="42" cy="100" r="7" fill="#1A3A30"/>
  <circle cx="78" cy="100" r="7" fill="#1A3A30"/>
  <circle cx="44" cy="98" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="80" cy="98" r="2.5" fill="white" opacity="0.5"/>
  <!-- Cheeks -->
  <ellipse cx="38" cy="116" rx="9" ry="7" fill="#D46070" opacity="0.4"/>
  <ellipse cx="82" cy="116" rx="9" ry="7" fill="#D46070" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M50 132 Q60 140 70 132" stroke="#C06080" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="18" cy="152" rx="14" ry="9" fill="#6B3A18" transform="rotate(-15,18,152)"/>
  <ellipse cx="102" cy="152" rx="14" ry="9" fill="#6B3A18" transform="rotate(15,102,152)"/>
  <line x1="8" y1="154" x2="16" y2="160" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="151" x2="18" y2="158" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="149" x2="21" y2="157" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="103" y1="154" x2="111" y2="160" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="99" y1="151" x2="107" y2="157" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
</svg>
